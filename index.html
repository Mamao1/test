<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./styles.css" />
  <title>Cadastro de Estudante</title>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>Cadastro de Estudante</h2>
    </div>

    <form id="form" class="form">
      <div class="form-control">
        <label for="username">Nome de usuário</label>
        <input type="text" id="username" placeholder="Digite seu nome" />
        <small>Mensagem de erro</small>
      </div>

      <div class="form-control">
        <label for="email">Email</label>
        <input type="text" id="email" placeholder="digite seu email estudantil" />
        <small>Mensagem de erro</small>
      </div>

      <div class="form-control">
        <label for="telefone">Telefone</label>
        <input type="text" id="telefone" placeholder="Digite seu numero" />
        <small>Mensagem de erro</small>
      </div>

      <div class="form-control">
        <label for="tipo">Tipo de Conta</label>
        <select id="tipo" onchange="mostrarCampos()">
          <option value="">Selecione</option>
          <option value="pf">Pessoa Física</option>
          <option value="pj">Pessoa Jurídica</option>
        </select>
      </div>

      <!-- Campos PF -->
      <div id="pf-campos" class="form-control hidden">
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" placeholder="Digite seu CPF" />
      </div>

      <!-- Campos PJ -->
      <div id="pj-campos" class="form-control hidden">
        <label for="cnpj">CNPJ</label>
        <input type="text" id="cnpj" placeholder="Digite seu CNPJ" />
      </div>

      <div class="form-control">
        <label for="password">Senha</label>
        <input type="password" id="password" placeholder="Digite sua senha" />
        <small>Mensagem de erro</small>
      </div>

      <div class="form-control">
        <label for="password-confirmation">Confirmação de senha</label>
        <input type="password" id="password-confirmation" placeholder="Confirme a senha" />
        <small>Mensagem de erro</small>
      </div>

      <button type="submit">Cadastrar</button>
    </form>
  </div>

  <footer>
    <p>Desenvolvido por Luis, Sergio e Gbariel – 2º ano Informática</p>
  </footer>

  <script src="./java.js"></script>
</body>
</html>
